org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# The sandbox running these builds forbids listening sockets, which the Gradle
# daemon needs for client communication; single-use daemons avoid it entirely.
org.gradle.daemon=false
# KSP 2.2.10-2.0.2 (the newest line compatible with AGP 9.4.1's bundled KGP
# 2.2.10) still registers generated sources via kotlin.sourceSets, which
# built-in Kotlin forbids by default. Suppression is AGP's documented escape
# hatch; Room codegen itself is proven by the persistence tests. Revisit when
# KSP ships a built-in-Kotlin-native release.
android.disallowKotlinSourceSets=false
